[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-text-editor"
version = "0.1.0"
description = "A simple desktop Markdown Editor"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "markdown-it-py",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
]

[project.scripts]
markdown-text-editor = "markdown_editor.main:main"

[tools.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "I",  # isort
]